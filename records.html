<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08403C"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230E5E59%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Georgia%27%3EC%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Medical records &middot; CareLink Bauchi</title></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">&#9776;</button>
        <div><h1 class="page-title">Medical records</h1><div class="page-sub">One record across every facility &middot; Patient ID PT-04821</div></div>
      </div>
      <div class="topbar-right"><div class="status-pill" id="netPill"><span class="status-dot"></span><span>Synced &middot; Online</span></div><div class="avatar" data-user-initials></div></div>
    </header>
    <div class="card">
      <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>
      <div class="filters"><label class="sr-only" for="q">Search records</label><input id="q" type="search" placeholder="Search by condition or facility"></div>
      <div id="list"></div>
    </div>
  </main>
</div>
<script src="app.js"></script>
<script>
(function(){
  if (!CL.guard(['patient'])) return;
  CL.shell('records.html');
  var $ = function(id){ return document.getElementById(id); };
  var R = [
    { type: 'Visit', title: 'Malaria \u2014 Treated', where: 'ATBUTH General Hospital', date: '14 Aug 2026', status: ['Resolved', 'green'], note: 'Treated with a full course of artemisinin-based therapy. Symptoms cleared at the follow-up call.' },
    { type: 'Lab', title: 'Full blood count', where: 'Ningi PHC', date: '12 Aug 2026', status: ['Reviewed', 'blue'], note: 'Result uploaded by Ningi PHC and reviewed by the attending doctor.' },
    { type: 'Prescription', title: 'Folic acid and iron supplements', where: 'ATBUTH General Hospital', date: '10 Aug 2026', status: ['Active', 'blue'], note: 'Renewed by Dr. Bello Suleiman. Continue until the next antenatal review.' },
    { type: 'Visit', title: 'Antenatal checkup', where: 'Ningi PHC', date: '02 Jul 2026', status: ['Ongoing', 'blue'], note: 'Routine antenatal visit. Blood pressure and weight within the normal range.' },
    { type: 'Visit', title: 'Referral to ATBUTH', where: 'Ningi PHC', date: '28 Jun 2026', status: ['Referred', 'amber'], note: 'Referred to ATBUTH General Hospital for specialist review.' }
  ];
  var type = 'All', types = ['All', 'Visit', 'Lab', 'Prescription'];
  function chips(){
    $('filters').innerHTML = '';
    types.forEach(function(t){ var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t === 'All' ? 'All' : t + 's'; b.setAttribute('aria-pressed', t === type); b.onclick = function(){ type = t; chips(); draw(); }; $('filters').appendChild(b); });
  }
  function draw(){
    var q = $('q').value.trim().toLowerCase();
    var list = R.filter(function(r){ return (type === 'All' || r.type === type) && (!q || (r.title + ' ' + r.where).toLowerCase().indexOf(q) > -1); });
    $('list').innerHTML = list.length ? list.map(function(r){
      return '<details class="rec"><summary><div><div class="rec-name">' + CL.esc(r.title) + '</div><div class="rec-meta">' + CL.esc(r.where) + ' \u00b7 ' + r.date + '</div></div><span class="tag tag-' + r.status[1] + '">' + r.status[0] + '</span></summary><div class="rec-body"><p>' + CL.esc(r.note) + '</p></div></details>';
    }).join('') : '<div class="empty">No records match. Clear the search or choose another filter.</div>';
  }
  $('q').addEventListener('input', draw);
  chips(); draw();
})();
</script>
</body></html>
