<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#08403C"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230E5E59%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Georgia%27%3EC%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>My queue &middot; CareLink Bauchi</title></head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">&#9776;</button>
        <div><h1 class="page-title">Today's queue</h1><div class="page-sub">Dr. Bello Suleiman &middot; General Medicine &middot; ATBUTH Bauchi</div></div>
      </div>
      <div class="topbar-right"><div class="status-pill" id="netPill"><span class="status-dot"></span><span>Synced &middot; Online</span></div><div class="avatar" data-user-initials></div></div>
    </header>

    <div class="row">
      <div class="queue">
        <div class="card" style="padding:14px">
          <h2 class="card-label" id="qCount">Patients</h2>
          <div id="queue"></div>
        </div>
      </div>
      <div class="col">
        <div class="card" id="detail"></div>
      </div>
    </div>
  </main>
</div>

<dialog id="referDlg" aria-labelledby="rTitle">
  <form method="dialog" id="referForm">
    <h2 id="rTitle">Refer to another facility</h2>
    <p class="note" id="rWho" style="margin-bottom:14px"></p>
    <div class="field"><label for="rFac">Receiving facility</label><select id="rFac"></select></div>
    <div class="field"><label for="rReason">Reason for referral</label><input id="rReason" maxlength="120" required></div>
    <div class="dlg-actions"><button class="btn-ghost" value="cancel" formnovalidate>Cancel</button><button class="btn" value="ok" id="rOk">Send referral</button></div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
(function(){
  if (!CL.guard(['doctor'])) return;
  CL.shell('doctor_console.html');
  var $ = function(id){ return document.getElementById(id); };
  var PATIENTS = [
    { id: 'PT-04821', name: 'Amina Ibrahim', age: 27, sex: 'F', lga: 'Ningi LGA', time: '10:30 AM', type: 'Follow-up', cond: 'Antenatal checkup', dx: 'Routine antenatal follow-up, 28 weeks. Blood pressure and weight within normal range.', rx: 'Continue folic acid and iron supplementation. Return in 4 weeks.', hist: [['Antenatal checkup', 'Ningi PHC \u00b7 02 Jul 2026'], ['Malaria \u2014 Treated', 'ATBUTH \u00b7 14 Aug 2026'], ['Referred from Ningi PHC', '28 Jun 2026']] },
    { id: 'PT-03177', name: 'Yakubu Danladi', age: 41, sex: 'M', lga: 'Kafin Zaki LGA', time: '11:00 AM', type: 'New complaint', cond: 'Persistent cough', dx: '', rx: '', hist: [['Typhoid \u2014 Treated', 'Kafin Zaki PHC \u00b7 03 Mar 2026']] },
    { id: 'PT-02954', name: 'Halima Sani', age: 34, sex: 'F', lga: 'Ningi LGA', time: '11:30 AM', type: 'Referral review', cond: 'Specialist review', dx: '', rx: '', hist: [['Referred from Ningi PHC', '20 Aug 2026']] },
    { id: 'PT-05540', name: 'Emeka Obi', age: 52, sex: 'M', lga: 'Ganjuwa LGA', time: '1:00 PM', type: 'Lab review', cond: 'Lab escalation', dx: '', rx: '', hist: [['Hypertension review', 'Ganjuwa PHC \u00b7 11 Aug 2026']] },
    { id: 'PT-01308', name: 'Fatima Aliyu', age: 19, sex: 'F', lga: 'Bauchi LGA', time: '2:30 PM', type: 'New complaint', cond: 'Recurring headaches', dx: '', rx: '', hist: [] },
    { id: 'PT-06022', name: 'Musa Abdullahi', age: 63, sex: 'M', lga: 'Misau LGA', time: '3:00 PM', type: 'Follow-up', cond: 'Diabetes follow-up', dx: '', rx: '', hist: [['Diabetes review', 'Misau General \u00b7 30 Jul 2026']] }
  ];
  var notes = CL.store.get('consults', {}), refs = CL.store.get('referrals', []), cur = 0;

  function drawQueue(){
    $('qCount').textContent = PATIENTS.length + ' patients \u00b7 ' + CL.short(CL.iso(new Date()));
    $('queue').innerHTML = PATIENTS.map(function(p, i){
      var seen = notes[p.id] && notes[p.id].saved;
      return '<button type="button" class="q-item" data-i="' + i + '"' + (i === cur ? ' aria-current="true"' : '') + '><div class="q-name"><span>' + CL.esc(p.name) + '</span>' + (seen ? '<span class="tag tag-green">Seen</span>' : '') + '</div><div class="q-meta">' + CL.esc(p.time) + ' \u00b7 ' + CL.esc(p.type) + '</div></button>';
    }).join('');
  }
  function drawDetail(){
    var p = PATIENTS[cur], n = notes[p.id] || {}, dx = n.dx != null ? n.dx : p.dx, rx = n.rx != null ? n.rx : p.rx;
    var referred = refs.filter(function(r){ return r.patientId === p.id; }).length;
    $('detail').innerHTML =
      '<div class="patient-head"><div><h2 class="p-name">' + CL.esc(p.name) + '</h2><div class="p-meta">' + CL.esc(p.id) + ' \u00b7 ' + p.age + p.sex + ' \u00b7 ' + CL.esc(p.lga) + ' \u00b7 ' + CL.esc(p.cond) + '</div></div><span class="tag tag-blue">Doctor access</span></div>' +
      '<div class="row" style="gap:20px;margin-bottom:0"><div class="col">' +
      '<div class="field"><label for="dx">Diagnosis</label><textarea id="dx" rows="3">' + CL.esc(dx) + '</textarea></div>' +
      '<div class="field"><label for="rx">Prescription</label><textarea id="rx" rows="3">' + CL.esc(rx) + '</textarea></div>' +
      '<div class="actions" style="margin:0"><button class="btn" type="button" id="save">Save consultation</button><button class="btn-ghost" type="button" id="refer">Refer to another facility</button></div>' +
      (n.saved ? '<p class="note" style="margin-top:10px">Saved ' + CL.esc(n.saved) + '.</p>' : '') + (referred ? '<p class="note" style="margin-top:6px">' + referred + ' referral(s) sent for this patient.</p>' : '') +
      '</div><div class="col col-narrow" style="width:250px"><h3 class="card-label">Consultation history</h3>' +
      (p.hist.length ? p.hist.map(function(h){ return '<div class="hist-item"><div class="hist-title">' + CL.esc(h[0]) + '</div><div class="hist-meta">' + CL.esc(h[1]) + '</div></div>'; }).join('') : '<p class="note">No earlier consultations on record.</p>') +
      '</div></div>';
    $('save').onclick = function(){
      var d = $('dx').value.trim(), r = $('rx').value.trim();
      if (!d) { CL.toast('Add a diagnosis before saving.', true); $('dx').focus(); return; }
      var t = new Date(); notes[p.id] = { dx: d, rx: r, saved: t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) };
      CL.store.set('consults', notes); CL.toast('Consultation saved for ' + p.name + '.'); drawQueue(); drawDetail();
    };
    $('refer').onclick = function(){
      $('rWho').textContent = 'Patient: ' + p.name + ' (' + p.id + ')';
      $('rFac').innerHTML = CL.FACILITIES.map(function(f){ return '<option>' + CL.esc(f) + '</option>'; }).join('');
      $('rReason').value = p.cond; $('referDlg').showModal(); $('rReason').focus();
    };
  }
  $('queue').addEventListener('click', function(e){ var b = e.target.closest('.q-item'); if (!b) return; cur = +b.dataset.i; drawQueue(); drawDetail(); });
  $('referForm').addEventListener('submit', function(e){
    if (e.submitter && e.submitter.value !== 'ok') return;
    var p = PATIENTS[cur], reason = $('rReason').value.trim(); if (!reason) { e.preventDefault(); return; }
    refs.push({ patientId: p.id, patient: p.name, from: 'ATBUTH Bauchi', to: $('rFac').value.split(' \u2014 ')[0], reason: reason, status: 'Pending' });
    CL.store.set('referrals', refs); CL.toast('Referral sent for ' + p.name + '.'); drawDetail();
  });
  drawQueue(); drawDetail();
})();
</script>
</body></html>
